name: Refresh Market Data

on:
  schedule:
    # Run annually on April 1st — after BLS/Census release new data
    - cron: '0 12 1 4 *'
  workflow_dispatch: # Allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate market data
        run: npx tsx scripts/generate-market-data.ts

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet apps/marketing/lib/market-data.ts || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/marketing/lib/market-data.ts
          git commit -m "chore: refresh market data (Census CBP + BLS OEWS)"
          git push
